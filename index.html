<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>宝可梦房东 · poke-rent</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-icon">◈</span> 宝可梦房东 <span class="sub">火箭队收租</span></div>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">金币</span><span class="hud-value" id="hud-coins">1</span></div>
      <div class="hud-item"><span class="hud-label">下次房租</span><span class="hud-value" id="hud-rent">80</span></div>
      <div class="hud-item"><span class="hud-label">剩余转动</span><span class="hud-value" id="hud-spins">5</span></div>
      <div class="hud-item"><span class="hud-label">进度</span><span class="hud-value" id="hud-progress">0/7</span></div>
      <button class="btn btn-ghost btn-dex" id="btn-dex">图鉴 0/18</button>
    </div>
  </header>

  <main class="main">
    <section class="machine">
      <div class="machine-title"><span class="machine-name">精灵球机</span><span class="machine-status" id="machine-status">按转动开始</span></div>
      <div class="reel" id="reel"></div>
      <div class="machine-controls">
        <button class="btn btn-spin" id="btn-spin">转动 <span class="btn-cost">-1 金</span></button>
        <button class="btn btn-ghost" id="btn-skip" style="display:none">跳过动画</button>
        <button class="btn btn-ghost" id="btn-restart">重开</button>
      </div>
      <div class="gain-line" id="gain-line">—</div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>我的卡池 <span class="count" id="pool-count">6</span></h2>
        <div class="pool" id="pool"></div>
      </section>
      <section class="panel">
        <h2>永久物品 <span class="hint">当局生效</span></h2>
        <div class="items" id="items"><div class="empty">暂无</div></div>
      </section>
      <section class="panel">
        <h2>消耗品</h2>
        <div class="items" id="tokens"></div>
      </section>
      <section class="panel rank-panel">
        <details id="rank-box">
          <summary>贡献金币排名 <span class="count" id="rank-total">0</span></summary>
          <div class="rank-list" id="rank"></div>
        </details>
      </section>
      <section class="panel log-panel">
        <h2>日志</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>

  <button class="modal-dock" id="modal-dock" style="display:none">选择宝可梦 ▾</button>

  <div class="modal-layer" id="modal-layer" style="display:none">
    <div class="modal" id="modal"></div>
  </div>
  <div class="modal-layer dex-layer" id="dex-layer" style="display:none">
    <div class="modal dex-modal" id="dex-modal"></div>
  </div>
</div>
<script src="js/data.js?v=5"></script>
<script src="js/dex-data.js?v=5"></script>
<script src="js/engine.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
</body>
</html>
